# Switch registry (29 Oct 2026): every switch of REGULUS_VALIDATOR_PRECISION (regulus.rag.validator_switches), one
# entry each. Machine-readable twin of that module's docstring; the docstring stays the long-form record.
#
#   status       default      - in validator_switches.DEFAULT (what the UI and the API run)
#                candidate    - measured as part of a net gain, not yet in DEFAULT (promotion decided on run results)
#                experimental - built, off, not yet measured (or being measured in a pending run)
#                rejected     - measured and left off: no net gain, or a loss
#   in_default   must equal (id in validator_switches.DEFAULT); tests/test_switch_registry.py checks it
#   stage        where it acts - docs/STAGES.md: retrieval, selection, router, composer, generation, answer_checks,
#                post_answer, conversation, planning
#   code         false only for a switch that was documented but never had (or no longer has) a code path
#   evidence     the measurement, with its source: VS = the validator_switches docstring, LEDGER =
#                ~/regulus_eval_runs/cos50_20261027/LEDGER.md, MEM = the session memory notes of that date
#
# Report: python scripts/switch_report.py   (--status X, --stage X, --run full300d, --check)

