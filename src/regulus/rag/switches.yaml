      with captions 1st (T-007: 904 ingredient listing 3rd -> 2nd); not yet measured
    interactions: [DR1, AU1]

  CP1:
    purpose: a question asking how several things differ reads up to 3 picker choices; a CFR pick from another part joins as a companion when the cross-encoder rates it >= REGULUS_SP2F_MIN_SCORE against the question or against the compared item it is about
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-02", commit: "this commit (CP1)"}
    evidence: >-
      12 of 300 questions compare; T-004 picker named 1107.16, 1107.13, 1114.1 and only the first two were read.
      A pick is judged against its own compared item ("What is a PMTA (premarket tobacco product application)?":
      1114.1 0.918; the whole question scored it 0.019); not yet measured
    interactions: [SP2, SP2F]

  DA1:
    purpose: the apply format's first part is the direct answer in at most three sentences (decision, period, amount or place, deciding provision); the requirements stay with their paragraphs, not written twice
    stage: generation
    status: experimental
    in_default: false
    introduced: {date: "2026-11-02", commit: "this commit (DA1)"}
    evidence: >-
      full300d - 90 of 184 model answers state their content twice; removing the repeat after generation (DD1) lost 3
      PASS blind and was rejected, so the model is asked not to write it; not yet measured
    interactions: [AL1]

  TE1:
    purpose: targeted revision - a draft whose every error is one sentence's gets those sentences back numbered with their problems and returns each corrected or DELETE; the rest is kept; a revision that does not validate falls back to the full rewrite
    stage: generation
    status: experimental
    in_default: false
    introduced: {date: "2026-11-02", commit: "this commit (TE1)"}
    evidence: >-
      full300d - 86 correction passes (1.49 h of 8.0 h), 49 with only sentence-level errors (0.75 h, 21 accepted);
      six18 2 Nov B-005/B-002 spent ~4 min rewriting ~2,000 tokens each; not yet measured
    interactions: [RX1, CX1, PX1]

  OF1:
    purpose: when the requested section does not fit, its top-level paragraphs compete first (outline first) - only for a question asking no particular value, and only when the top level costs at most a third of the ceiling
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-02", commit: "this commit (OF1)"}
    evidence: >-
      full300d - a key section was cut by the ceiling in 23 non-PASS answers and 3 PASS; L-013 kept 28 of 101.36's 82
      paragraphs, deep (b)(2)(i)(A) items but not (d) (source ingredients, part of plant); not yet measured
    interactions: [CB1, HX1, RR2]

  DX1:
    purpose: for a question asking a definition, a supplied definition that only points elsewhere ("has the meaning set forth in § 3.2(e)") brings the paragraph it points to as a companion - one hop, CFR only, a paragraph never a whole section
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-02", commit: "this commit (DX1)"}
    evidence: >-
      six18 2 Nov X-001 ("How is a combination product defined") had 4.2's pointer, not 3.2(e) - scored "definition
      loose, 3.2(e) not cited"; 28 rows in 15 sections define a term this way; not yet measured
    interactions: [DQ1]

  CF1:
    purpose: companion floor - when a long first section would take every evidence slot, each companion section keeps its one most relevant paragraph (MMR-style diversity floor); the first section fills the rest as RR2 orders it
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-02", commit: "this commit (CF1)"}
    evidence: >-
      bundle 2 Nov - F-002: 117.5 took all 35 slots, companions 117.3 (the qualified facility definition) and 117.201
      supplied nothing; A-004: 558.6 took 48, Part 225 none; not yet measured
    interactions: [RR2, RR1, OF1, MS1]

  AO1:
    purpose: a list the answer restates item by item keeps its source's joining word - "(i) ..., (ii) ..., or (iii)" for a source list ending "; and (iii)" becomes "and"; only that word changes, only when every item matches its source item
    stage: answer_checks
    status: default
    in_default: true
    introduced: {date: "2026-11-02", commit: "this commit (AO1)"}
    evidence: >-
      bundle 2 Nov K-002 turned 50.24(a)(2)'s three required conditions into alternatives (scored PF for it); over 324
      recorded answers (42 with a joining word before a list label) it changes K-002 only; not yet measured
    interactions: [TE1]

  PC2:
    purpose: PC1 for companions - a supplied 21 CFR section the validated answer never cites contributes its paragraph the cross-encoder scores highest for the question (>= PC1_MIN_SCORE), at most 2 sections, verbatim and cited
    stage: post_answer
    status: experimental
    in_default: false
    introduced: {date: "2026-11-02", commit: "this commit (PC2)"}
    evidence: >-
      29 Oct 300Q - of 44 omission PARTIALLY FAILs traced, 10 had the omitted section supplied and unused; naming it in
      a note (CM2) lost 2 PASS blind, so the provision's words are quoted instead; not yet measured
    interactions: [PC1]

  # ------------------------------------------------------------------ 3 Nov: full300e partial-fail analysis
  XG1:
    purpose: XC1's cross-part companion must come from the promoted section's programme (Title 21 subchapter; Subchapter A, Parts 1-99, joins any)
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-03", commit: "this commit (XG1)"}
    evidence: >-
      combo4_20261103 (3 Nov) - U-003 PF->PP reproduced in 3 blind passes; D-008 M-021 G-005 D-016 same; 0 confirmed down; earlier: full300e vs full300d - the 8 XC1 additions from another programme went 4 down / 0 up (D-008 111.30, M-021 211.198,
      U-002 201.5, U-003 201.120; three were PASS); the 6 XC1 ups were all same-programme; not yet measured
    interactions: [XC1]
  MK1:
    purpose: a source marker naming several sources ("[13–19, 21]") is not a figure for the unsupported-figure check
    stage: answer_checks
    status: experimental
    in_default: false
    introduced: {date: "2026-11-03", commit: "this commit (MK1)"}
    evidence: >-
      full300e - 10 of the 14 drafts withheld with unsupported_figure were flagged over marker numbers only (X-002,
      Z-005, R-006, A-004, P-009, K-003, B-002, Y-001, F-005, S-008, S-019); not yet measured
    interactions: [A1]
  EX2:
    purpose: an exemption the answer states is supported by a source saying the rule "does not apply" / "not subject to", and by the cited paragraph's section heading ("117.5 Exemptions")
    stage: answer_checks
    status: experimental
    in_default: false
    introduced: {date: "2026-11-03", commit: "this commit (EX2)"}
    evidence: >-
      full300e F-002 (PF) withheld for 6 condition_not_in_cited_source findings, each "exempt" restating a 117.5
      paragraph that says "do not apply"; not yet measured
    interactions: [EX1, C2, C3]
  DR2:
    purpose: DR1 routing for the benchmark domains it left unrouted - device labeling/UDI/IVD labeling (801/809/830), device postmarket reporting (803/806/821/822), FSVP (Part 1), seafood HACCP (123), juice HACCP (120), low-acid canned and acidified foods (108/113/114), produce safety (112); tobacco also by its "appropriate for the protection of the public health" standard
    stage: retrieval
    status: default
    in_default: true
    introduced: {date: "2026-11-03", commit: "this commit (DR2)"}
    evidence: >-
      combo4_20261103 (3 Nov) - Y-009 FAIL->PASS (2 passes), V-004 FAIL->PF, U-003 PF->PP; U-002/R-001 downs (withheld drafts) not confirmed by a second scorer; U-006 PASS kept; earlier: gold-labelled bank (6,875 generated questions): 231 newly routed, 97.4% inside the gold part's programme (DR1:
      97.6%), 0 DR1 routes changed; 300Q fires 27 (Y-009 V-004 U-001 R-001 T-002 among them); not yet measured
    interactions: [DR1, XG1]
  SR1:
    purpose: an answer about to be WITHHELD whose errors are each one sentence's is delivered without those sentences (cited ones too, A3's guards otherwise), when the rest validates in full - the source's own items appended for an omission; never in place of a quoted fallback
    stage: post_answer
    status: experimental
    in_default: false
    introduced: {date: "2026-11-03", commit: "this commit (SR1)"}
    evidence: >-
      full300e - 6 of 27 FAILs were declines although one or two sentences carried the error (D-001, C-002); quoted
      fallbacks give 18 PASS, so SR1 leaves them alone; not yet measured
    interactions: [A3]
  QS1:
    purpose: the QMSR effective-date status note (89 FR 7496, effective 2 Feb 2026; Subparts C-O removed and reserved; ISO 13485 incorporated by reference), appended to an answer citing part 820 only when the question asks what changed with the amendment or its compliance/effective date
    stage: post_answer
    status: default
    in_default: true
    introduced: {date: "2026-11-03", commit: "this commit (QS1)"}
    evidence: >-
      combo4_20261103 (3 Nov) - M-030 PF->PP in 2 blind passes; 0 down; earlier: full300e M-030 (PF) said the compliance date is not in the sources - no eCFR paragraph carries it; the fact is the
      final rule's, already in data/reference/qmsr_v1.json; 300Q fires 1 (M-030), bank 8; not yet measured
    interactions: [S1]
  PK3:
    purpose: the picker's third and later picks of the promoted section's part (at the second pick's cross-encoder floor, short enough to go whole) take the places of the reranker's lowest-scored additions, one for one, within MS1's allowance - never added on their own
    stage: selection
    status: default
    in_default: true
    introduced: {date: "2026-11-03", commit: "this commit (PK3)"}
    evidence: >-
      combo4_20261103 (3 Nov) - P-010 PF->PASS in 2 blind passes (812.46 supplied); S-016 PF for its new answer in 3 passes, its old answer PF in both paired passes (official PASS not reproduced); 0 confirmed down; earlier: full300e - key share of supplied additions: reranked companions 23/215 (11%), picker second picks 26/57 (46%),
      unused later same-part picks 6/12 (50%: B-005 606.160, P-010 812.46, Y-002 112.45/112.46, C-004); not yet measured
    interactions: [MS1, SP2, SP2F]

  # ------------------------------------------------------------------ 4 Nov: RAG improvement programme (REGULUS_RAG_IMPROVEMENT_PROGRESS.md)
  TR1:
    purpose: report-only per-question trace (regulus.rag.trace) - the candidate branch, routed programme and added search terms, each candidate's lexical score, the reranker scores and RO1 order, the pick and any veto, MS1/XC1 pools with scores, companions by the step that added them; the answer is byte-identical on or off
    stage: retrieval
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (TR1)"}
    evidence: >-
      report-only - reads values the pipeline already computed, never scores or queries; tests/test_trace_tr1.py checks
      the same answer, prompt and promotion with TR1 on and off; to be on in every arm of the 4 Nov programme, Test A
      included
    interactions: [RO1, MS1, XC1, XG1, PC1]
  CC1:
    purpose: report-only verdict for every citation of the delivered answer (regulus.rag.citation_verdicts) - valid, exists but does not support, wrong section or programme, cannot verify - from the validator's own checks re-run on the delivered text, the cited source's identity, word overlap and the question's programme; nothing is corrected
    stage: post_answer
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (CC1)"}
    evidence: >-
      report-only, changes no answer (tests/test_citation_verdicts_cc1.py); it reports the gap the validator leaves open
      - a paragraph path fabricated inside a supplied section-level source passes validate_answer; its machine
      citation-accuracy figure is reported beside the scorer's column L in every arm, never instead of it
    interactions: [A4, CN1, C82, CM1]
  AV1:
    purpose: report-only verdict for the delivered answer (regulus.rag.answer_verdict) - complete, correct but incomplete, unsupported, incorrect, insufficient evidence / safe refusal - from the fallback path, the validator's checks re-run on the delivered text, CC1's citation verdicts and the evidence-limit and not-found notices; nothing changes
    stage: post_answer
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (AV1)"}
    evidence: >-
      report-only, changes no answer (tests/test_answer_verdict_av1.py); a deterministic proxy, never the grade - its
      agreement with the blind scorer's verdict is reported per arm; carries over the worktree's VC1 (partial provision
      coverage) as its incomplete reasons
    interactions: [CC1, QP1]
  SB1:
    purpose: co-promoted FD&C Act text shares the ceiling the regulation's evidence was selected under (CB1's 15,000 characters, from selection.policy), not the 9,000-character default; an Act block that still does not fit is recorded as dropped required evidence, so the answer's evidence-limit notice names it
    stage: selection
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (SB1)"}
    evidence: >-
      code review 4 Nov (pipeline.statute_selection) - with a regulation over 9,000 characters every co-promoted Act block
      was dropped although CB1 left room, and the drop then vanished (the unchanged selection was returned, so no notice);
      statute-only promotions are capped at STATUTE_BUDGET (6,000) and do not change; tests/test_statute_budget_sb1.py;
      not yet measured
    interactions: [CB1, ST1]
  BU1:
    purpose: the evidence budget charges each SOURCE block with the "Tier:" line the prompt renders (generation.tier_line, shared with PackagedSource.role_line), so the SOURCES block stays within the ceiling that bounds it
    stage: selection
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (BU1)"}
    evidence: >-
      code review 4 Nov - 40-110 uncharged characters per source, up to 2,000-5,000 past the 15,000 ceiling with 48
      paragraphs; with BU1 the charge equals the rendered block exactly (tests/test_budget_accounting_bu1.py); it can
      only admit less evidence than today (a marginal last paragraph), so a loss of evidence is the risk to measure;
      not yet measured
    interactions: [BA1, CB1, HX1]
  PP1:
    purpose: a paragraph is identified by its row - where paths repeat (DEF1 definitions sections, "(1)" under each definition) a row's parent is the nearest earlier row of its parent path and its subparagraphs are the rows after it up to the next row of its own path, in the required order and in the completed-chain check; citation labels of any case and up to 8 characters have an identity, so consolidate_evidence never merges two provisions' identical text
    stage: selection
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (PP1)"}
    evidence: >-
      4 Nov database count - 59 repeated paths (192 rows) in 24 sections, mostly definitions (117.3, 1.1310, 830.3,
      1114.3, 1.227, 801.3); code review - a "(1)" counted as completed by any definition's lead, and "(A)"/"(xviii)"
      labels had no identity, so identical text of two provisions could merge (tests/test_paragraph_identity_pp1.py);
      sections with unique paths keep the prefix rule; not yet measured
    interactions: [DEF1, DEF2, OF1, CF1]
  LP1:
    purpose: inside a section that does not fit, a paragraph's relevance is the reciprocal-rank fusion of the question terms it contains and its similarity to the question in the Title 21 paragraph index (bge-small, already loaded); a list's items take their list's best score and compete as one; a child of a requested provision cut by the ceiling is named in the evidence-limit notice under that provision
    stage: selection
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (LP1)"}
    evidence: >-
      full300e - 83 answers carried an evidence-limit note (57% PF/FAIL), 24 key sections exceed 15,000 characters
      (101.9: 124,479); paragraphs were ranked by 6-letter word-prefix overlap only, and a cut child of a requested
      provision got no notice; RR1 (rejected) halved S-018's list, so list items move together
      (tests/test_paragraph_ranking_lp1.py); presentation stays in document order; not yet measured
    interactions: [OF1, CF1, PP1, RR1, RR2]
  TF1:
    purpose: the protected Top-5 core (regulus.rag.core_evidence) - required evidence is grouped into distinct units (a section's top-level paragraph family); each ask of the question in turn takes its most similar unit until five are chosen; up to eight when the question has more asks or a core paragraph points to another paragraph ("except as provided in paragraph (d)"); each unit's lead row and best paragraph compete first for the ceiling; every unit is recorded with its score and reason; an order, never a cap
    stage: selection
    status: experimental
    in_default: false
    introduced: {date: "2026-11-04", commit: "this commit (TF1)"}
    evidence: >-
      user brief 4 Nov (Top-5 with controlled expansion); full300e - 43 rows missed a governing section and 83 carried
      an evidence-limit note; before TF1 the first section's paragraphs could take every place under the ceiling
      (CF1 guards only one paragraph per companion); tests/test_core_evidence_tf1.py; not yet measured
    interactions: [QD1, OF1, CF1, LP1]

# Switches that are not part of REGULUS_VALIDATOR_PRECISION (their own environment variables)
other_switches:
  MC1:
    purpose: the MLX worker caps its buffer cache at 256 MB and empties it after each request (allocation only)
    variable: REGULUS_MLX_CACHE_LIMIT_MB (default 256; -1 restores the unlimited cache)
    where: scripts/mlx_worker.py
    status: default
    evidence: LEDGER 29 Oct 12:40 - S-006, F-002 raw drafts and answers byte-identical; picker 56-95 s -> 16-19 s
  PX1:
    purpose: prompt prefix KV cache in the MLX worker
    variable: REGULUS_MLX_PREFIX_CACHE (default on since 2 Nov; 0 turns it off; request field "prefix_cache")
    where: scripts/mlx_worker.py
    status: default
    evidence: on in every evaluation run since 28 Oct; not on in the app (MEM 29 Oct app-default-lags-benchmark); app default since 2 Nov 2026 (user)
